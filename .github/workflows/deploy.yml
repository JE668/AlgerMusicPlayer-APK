name: Deploy Web

on:
  push:
    branches:
      - main # 或者您的主分支名称
  workflow_dispatch: # 允许手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 创建环境变量文件
        run: |
          echo "VITE_API=${{ secrets.VITE_API }}" > .env.production.local
          echo "VITE_API_MUSIC=${{ secrets.VITE_API_MUSIC }}" >> .env.production.local
          # 添加其他需要的环境变量
          cat .env.production.local # 查看创建的文件内容，调试用

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: 检查部署密钥是否已配置
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DEPLOY_KEY }}" ] && [ -n "${{ secrets.SERVER_HOST }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ 部署密钥未配置，跳过部署步骤"
          fi

      - name: Deploy to Server
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: 'out/renderer/*'
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 2

      - name: Execute Remote Commands
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            echo "部署完成于 $(date)"
