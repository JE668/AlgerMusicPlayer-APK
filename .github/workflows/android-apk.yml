name: Build Android APK

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --ignore-scripts
        env:
          npm_config_ignore_scripts: true

      - name: Build web app
        run: npx electron-vite build
        env:
          VITE_API: https://unblock.170909.xyz

      - name: Verify web build output
        run: ls -la out/renderer/

      - name: Init Capacitor Android
        run: |
          # 移除 .gz 文件，避免 Android 资源合并冲突
          find out/renderer -name '*.gz' -delete
          npx cap add android

      - name: Sync Capacitor assets
        run: |
          find out/renderer -name '*.gz' -delete
          npx cap sync android

      - name: Fix Android cleartext traffic for HTTP audio
        run: |
          # 在 AndroidManifest 中添加 usesCleartextTraffic 允许 HTTP 音频
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
            echo "cleartext already set"
          else
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
            echo "✅ added cleartext traffic"
          fi
          cat "$MANIFEST" | head -15

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug

      - name: Find APK path
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlgerMusicPlayer-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.0-apk
          name: v5.2.0-apk (自动构建)
          body: |
            ## 🔧 自动构建 APK

            基于 commit: ${{ github.sha }}

            ### 修复内容
            - 切回 Vercel Enhanced API (标准443端口，Android WebView 兼容)
            - 修复 `withCredentials` + `Access-Control-Allow-Origin: *` CORS 冲突
            - APK 内歌单刷新和歌曲播放恢复正常

            ### 安装方式
            1. 下载 APK
            2. Android 设置 → 安全 → 允许安装未知来源应用
            3. 安装即可

            > ⚠️ 这是 debug 版本，如需 release 签名版本请提 issue
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: false